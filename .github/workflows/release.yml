# Purpose: release gate. All EARS ids tested, dependency scan, k6 placeholder. Runs on a version tag or by hand.
# Rules: standards/versions.md, standards/testing.md. Go or no-go stays a human stop (eng-release).
# UNVERIFIED: action major tags (checkout, pnpm/action-setup, setup-node). No source in the reports. Check the latest major of each.
# Package manager: pnpm only (decision 19). Check scripts run from scripts/ci/ in the client repo.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every check, including AC coverage and the override report
        run: bash scripts/ci/run-all.sh --release

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      # Optional second scanner. UNVERIFIED: action name and tag. Trivy releases use full version tags, check before enabling.
      # - uses: aquasecurity/trivy-action@<version>
      #   with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1" }

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: k6 placeholder
        run: |
          echo "PLACEHOLDER: the k6 load run is not wired yet."
          echo "Next step: install k6 (action UNVERIFIED) and run: k6 run tests/load/smoke.js"
